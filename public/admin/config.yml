backend:
  name: github
  repo: vknmurm-star/andreev-site
  branch: main
  base_url: https://andreev-zakon.ru
  auth_endpoint: api/auth

media_folder: "public/images/posts"
public_folder: "/images/posts"

collections:
  - name: "posts"
    label: "Судебная практика (статьи)"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Дата", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Краткое описание", name: "excerpt", widget: "text" }
      - { label: "Текст статьи", name: "body", widget: "markdown", body: true }

  - name: "pages"
    label: "Страницы услуг"
    files:
      - label: "Снять запрет на въезд"
        name: "snyat-zapret"
        file: "content/pages/snyat-zapret.md"
        fields:
          - { label: "Заголовок (H1)", name: "title", widget: "string" }
          - { label: "SEO: заголовок вкладки браузера", name: "metaTitle", widget: "string" }
          - { label: "SEO: описание для поисковиков", name: "metaDescription", widget: "text" }
          - { label: "Текст страницы", name: "body", widget: "markdown", body: true }
      - label: "Отменить депортацию/выдворение"
        name: "deportatsiya"
        file: "content/pages/deportatsiya.md"
        fields:
          - { label: "Заголовок (H1)", name: "title", widget: "string" }
          - { label: "SEO: заголовок вкладки браузера", name: "metaTitle", widget: "string" }
          - { label: "SEO: описание для поисковиков", name: "metaDescription", widget: "text" }
          - { label: "Текст страницы", name: "body", widget: "markdown", body: true }
      - label: "Проверить запрет на въезд"
        name: "proverit-zapret"
        file: "content/pages/proverit-zapret.md"
        fields:
          - { label: "Заголовок (H1)", name: "title", widget: "string" }
          - { label: "SEO: заголовок вкладки браузера", name: "metaTitle", widget: "string" }
          - { label: "SEO: описание для поисковиков", name: "metaDescription", widget: "text" }
          - { label: "Текст страницы", name: "body", widget: "markdown", body: true }
      - label: "Получить гражданство России"
        name: "grazhdanstvo"
        file: "content/pages/grazhdanstvo.md"
        fields:
          - { label: "Заголовок (H1)", name: "title", widget: "string" }
          - { label: "SEO: заголовок вкладки браузера", name: "metaTitle", widget: "string" }
          - { label: "SEO: описание для поисковиков", name: "metaDescription", widget: "text" }
          - { label: "Текст страницы", name: "body", widget: "markdown", body: true }
      - label: "Получить ВНЖ"
        name: "vnzh"
        file: "content/pages/vnzh.md"
        fields:
          - { label: "Заголовок (H1)", name: "title", widget: "string" }
          - { label: "SEO: заголовок вкладки браузера", name: "metaTitle", widget: "string" }
          - { label: "SEO: описание для поисковиков", name: "metaDescription", widget: "text" }
          - { label: "Текст страницы", name: "body", widget: "markdown", body: true }
      - label: "Получить РВП"
        name: "rvp"
        file: "content/pages/rvp.md"
        fields:
          - { label: "Заголовок (H1)", name: "title", widget: "string" }
          - { label: "SEO: заголовок вкладки браузера", name: "metaTitle", widget: "string" }
          - { label: "SEO: описание для поисковиков", name: "metaDescription", widget: "text" }
          - { label: "Текст страницы", name: "body", widget: "markdown", body: true }
      - label: "Стоимость услуг"
        name: "stoimost"
        file: "content/pages/stoimost.md"
        fields:
          - { label: "Заголовок (H1)", name: "title", widget: "string" }
          - { label: "SEO: заголовок вкладки браузера", name: "metaTitle", widget: "string" }
          - { label: "SEO: описание для поисковиков", name: "metaDescription", widget: "text" }
          - label: "Группы услуг"
            name: "groups"
            widget: "list"
            fields:
              - { label: "Название группы", name: "title", widget: "string" }
              - label: "Позиции"
                name: "rows"
                widget: "list"
                fields:
                  - { label: "Услуга", name: "service", widget: "text" }
                  - { label: "Цена", name: "price", widget: "string" }
          - { label: "Примечание внизу страницы", name: "footnote", widget: "text" }
      - label: "Главная страница"
        name: "home"
        file: "content/pages/home.md"
        fields:
          - { label: "SEO: заголовок вкладки браузера", name: "metaTitle", widget: "string" }
          - { label: "SEO: описание для поисковиков", name: "metaDescription", widget: "text" }
          - label: "Hero-блок"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Эйбраув (над заголовком)", name: "eyebrow", widget: "string" }
              - { label: "Заголовок, строка 1", name: "headingLine1", widget: "string" }
              - { label: "Заголовок, строка 2", name: "headingLine2", widget: "string" }
              - { label: "Подзаголовок", name: "subtitle", widget: "text" }
              - { label: "Телефон (для показа и звонка)", name: "phoneDisplay", widget: "string" }
              - { label: "Число лет практики", name: "statNumber", widget: "string" }
              - { label: "Подпись под числом лет", name: "statLabel", widget: "string" }
          - { label: "Заголовок блока Услуги", name: "servicesLabel", widget: "string" }
          - label: "Карточки услуг"
            name: "services"
            widget: "list"
            fields:
              - { label: "Ссылка (внутренний путь)", name: "href", widget: "string" }
              - { label: "Заголовок карточки", name: "title", widget: "string" }
              - { label: "Текст карточки", name: "text", widget: "text" }
          - { label: "Заголовок блока Компетенции", name: "competenciesLabel", widget: "string" }
          - { label: "Список компетенций", name: "competencies", widget: "list" }
          - { label: "Заголовок блока Условия оплаты", name: "paymentLabel", widget: "string" }
          - label: "Этапы оплаты"
            name: "paymentTerms"
            widget: "list"
            fields:
              - { label: "Процент", name: "percent", widget: "string" }
              - { label: "Описание", name: "description", widget: "string" }
          - { label: "Примечание про оплату под ключ", name: "paymentNote", widget: "text" }
          - { label: "Заголовок блока Типовые ситуации", name: "situationsLabel", widget: "string" }
          - label: "Типовые ситуации"
            name: "situations"
            widget: "list"
            fields:
              - { label: "Заголовок", name: "title", widget: "string" }
              - { label: "Текст", name: "text", widget: "text" }
          - { label: "Заголовок блока Контакты", name: "contactsLabel", widget: "string" }
          - { label: "Адрес", name: "address", widget: "string" }
      - label: "Контакты (текстовый блок)"
        name: "kontakty"
        file: "content/pages/kontakty.md"
        fields:
          - { label: "SEO: заголовок вкладки браузера", name: "metaTitle", widget: "string" }
          - { label: "SEO: описание для поисковиков", name: "metaDescription", widget: "text" }
          - { label: "Текст страницы (форма и адрес редактируются отдельно в коде)", name: "body", widget: "markdown", body: true }
