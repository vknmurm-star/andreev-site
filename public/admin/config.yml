backend:
  name: github
  repo: vknmurm-star/andreev-site
  branch: main
  base_url: https://egor.an51.su
  auth_endpoint: api/auth

media_folder: "public/images/posts"
public_folder: "/images/posts"

collections:
  - name: "posts"
    label: "Судебная практика (статьи)"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Дата", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Краткое описание", name: "excerpt", widget: "text" }
      - { label: "Текст статьи", name: "body", widget: "markdown", body: true }

  - name: "pages"
    label: "Страницы услуг"
    files:
      - label: "Снять запрет на въезд"
        name: "snyat-zapret"
        file: "content/pages/snyat-zapret.md"
        fields:
          - { label: "Заголовок (H1)", name: "title", widget: "string" }
          - { label: "SEO: заголовок вкладки браузера", name: "metaTitle", widget: "string" }
          - { label: "SEO: описание для поисковиков", name: "metaDescription", widget: "text" }
          - { label: "Текст страницы", name: "body", widget: "markdown", body: true }
      - label: "Отменить депортацию/выдворение"
        name: "deportatsiya"
        file: "content/pages/deportatsiya.md"
        fields:
          - { label: "Заголовок (H1)", name: "title", widget: "string" }
          - { label: "SEO: заголовок вкладки браузера", name: "metaTitle", widget: "string" }
          - { label: "SEO: описание для поисковиков", name: "metaDescription", widget: "text" }
          - { label: "Текст страницы", name: "body", widget: "markdown", body: true }
      - label: "Проверить запрет на въезд"
        name: "proverit-zapret"
        file: "content/pages/proverit-zapret.md"
        fields:
          - { label: "Заголовок (H1)", name: "title", widget: "string" }
          - { label: "SEO: заголовок вкладки браузера", name: "metaTitle", widget: "string" }
          - { label: "SEO: описание для поисковиков", name: "metaDescription", widget: "text" }
          - { label: "Текст страницы", name: "body", widget: "markdown", body: true }
      - label: "Получить гражданство России"
        name: "grazhdanstvo"
        file: "content/pages/grazhdanstvo.md"
        fields:
          - { label: "Заголовок (H1)", name: "title", widget: "string" }
          - { label: "SEO: заголовок вкладки браузера", name: "metaTitle", widget: "string" }
          - { label: "SEO: описание для поисковиков", name: "metaDescription", widget: "text" }
          - { label: "Текст страницы", name: "body", widget: "markdown", body: true }
